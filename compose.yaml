
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axora_api
    restart: unless-stopped
    env_file:
      - ${AXORA_API_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PYTHONPATH: /app/src
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:17-alpine
    container_name: axora_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - axora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_axora
    profiles: ["admin"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
    ports:
      - "127.0.0.1:8881:80"
    # volumes:
    #   - pgadmin_data:/var/lib/pgadmin
    # networks:
    #   - pg-network
    depends_on:
      - db

  mysql:
    image: mysql:8.4
    container_name: axora_mysql
    profiles: ["mysql", "mysql-agent"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-axora}
      MYSQL_USER: ${MYSQL_USER:-axora}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - axora-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping --protocol=TCP --host=127.0.0.1 --port=3306 --user=root
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api-mysql:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axora_api_mysql
    profiles: ["mysql-agent"]
    restart: unless-stopped
    env_file:
      - ${AXORA_INSTALL_ENV_FILE:?Set AXORA_INSTALL_ENV_FILE to the protected Axora install environment file}
    environment:
      DATABASE_URL: mysql+aiomysql://axora:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the Axora install environment}@mysql:3306/${AXORA_DATABASE_NAME:?Set AXORA_DATABASE_NAME in the Axora install environment}
      SEMANTIC_MODEL_PATH: /app/config/semantic.yaml
      PYTHONPATH: /app/src
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    volumes:
      - ${AXORA_SEMANTIC_MODEL_HOST_PATH:?Set AXORA_SEMANTIC_MODEL_HOST_PATH to the generated semantic manifest}:/app/config/semantic.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  axora-postgres-data:
  axora-mysql-data:
  